<!DOCTYPE html>
<html>
<head>
  <title>AI Debate Coach</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; line-height: 1.5; }
    textarea { width: 100%; height: 120px; font-size: 16px; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 20px; font-size: 16px; margin-top: 10px; cursor: pointer; }
    #results { margin-top: 20px; background: #f4f4f4; padding: 15px; border-radius: 5px; }
    h2 { margin-top: 0; color: #2c3e50; }
    h3 { margin-bottom: 5px; color: #34495e; }
    ul { margin-top: 5px; }
  </style>
</head>
<body>
  <h1>AI Debate Coach</h1>
  <textarea id="argument" placeholder="Type your argument here..."></textarea>
  <br>
  <button onclick="critique()">Get Critique</button>
  <div id="results"></div>

  <script>
   // ✅ CORRECTED LINE 20:
const BACKEND_URL = "https://logiclensproject.up.railway.app/critique";

    async function critique() {
      const argument = document.getElementById("argument").value;
      const resultsDiv = document.getElementById("results");

      if (!argument.trim()) {
        resultsDiv.innerText = "Please enter an argument first.";
        return;
      }

      resultsDiv.innerText = "Thinking...";

      try {
        const response = await fetch(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ argument: argument })
        });

        const rawText = await response.text();

        if (!response.ok) {
          throw new Error(rawText);
        }

        // Layer 1: Parse Groq response payload
        const groqData = JSON.parse(rawText);

        // Layer 2: Parse inner critique JSON string generated by Groq
        const contentString = groqData.choices[0].message.content;
        const data = JSON.parse(contentString);

        // Render formatted feedback
        let html = `<h2>Score: ${data.score || 0}/10</h2>`;
        
        if (data.strong_points && data.strong_points.length > 0) {
          html += `<h3>Strong Points:</h3><ul>` + 
            data.strong_points.map(p => `<li>${p}</li>`).join('') + `</ul>`;
        }

        if (data.weak_points && data.weak_points.length > 0) {
          html += `<h3>Weak Points:</h3><ul>` + 
            data.weak_points.map(p => `<li>${p}</li>`).join('') + `</ul>`;
        }

        if (data.fallacies && data.fallacies.length > 0) {
          html += `<h3>Fallacies Detected:</h3><ul>` + 
            data.fallacies.map(f => `<li><b>${f.type}:</b> "${f.quote}" — ${f.explanation}</li>`).join('') + `</ul>`;
        }

        resultsDiv.innerHTML = html;
      } catch (error) {
        console.error("Failed to fetch critique:", error);
        resultsDiv.innerText = "Error: " + error.message;
      }
    }
  </script>
</body>
</html>
